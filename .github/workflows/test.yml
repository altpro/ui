name: test

on:
  push:
  pull_request:

jobs:
  test:
    # 24.04 ships PHP 8.3 and Composer, which tests/blade.php needs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
