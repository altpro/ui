name: test

on:
  push:
  pull_request:

jobs:
  test:
    # 24.04 ships PHP 8.3 and Composer, which tests/blade.php needs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # the newest of everything, and the whole suite
          - laravel: 13
            composer: composer update
            browsers: chromium firefox webkit
            test: npm run build && npm test
    name: test (Laravel ${{ matrix.laravel }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: ${{ matrix.composer }} --no-interaction --no-progress
      - run: composer show laravel/framework | grep versions
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: ${{ matrix.test }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-laravel-${{ matrix.laravel }}
          path: test-results
